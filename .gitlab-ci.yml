# UNVERIFIED: written without access to a GitLab instance (target: GitLab 17.x). Dry-run it on a branch first.
# Needs CI/CD variables: BASE and PIP_INDEX_URL (your mirrors) if the defaults below are not reachable.
stages: [test, build]

variables:
  # Point these at your internal mirrors.
  PYTHON_IMAGE: python:3.12-slim
  KANIKO_IMAGE: gcr.io/kaniko-project/executor:v1.23.2-debug   # public executor; replace with your mirror
  BASE: registry.access.redhat.com/ubi9/ubi-minimal:9.5
  PIP_INDEX_URL: ""   # e.g. https://artifactory.internal/api/pypi/pypi/simple

test:
  stage: test
  image: $PYTHON_IMAGE
  script:
    - pip install ${PIP_INDEX_URL:+--index-url "$PIP_INDEX_URL"} PyYAML
    - SKIP_UI=1 bash tests/run.sh   # model + fetch tests, no browser

build:
  stage: build
  image: {name: $KANIKO_IMAGE, entrypoint: [""]}
  rules: [{if: $CI_COMMIT_TAG}]   # only on tags
  script:
    - mkdir -p /kaniko/.docker
    - |
      printf '{"auths":{"%s":{"auth":"%s"}}}' "$CI_REGISTRY" "$(printf '%s:%s' "$CI_REGISTRY_USER" "$CI_REGISTRY_PASSWORD" | base64 | tr -d '\n')" > /kaniko/.docker/config.json
    - >
      /kaniko/executor --context "$CI_PROJECT_DIR" --dockerfile Dockerfile
      --build-arg BASE="$BASE" --build-arg PIP_INDEX_URL="$PIP_INDEX_URL"
      --destination "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
