<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fleet Map</title>
<style>
:root{color-scheme:light dark;
--canvas:#f2f2f7;--surf:#fff;--surf2:#f6f6f9;--hov:#f0f1f5;--line:#e2e2e8;--line2:#c9c9d0;
--fg:#1c1c1e;--mut:#5c5c66;--accent:#0952c4;--accbg:#e6efff;--tint:rgba(10,90,212,.07);--tint2:rgba(10,90,212,.14);
--ok:#14632f;--okbg:#e2f4e8;--unv:#484f5c;--unvbg:#eaecf0;--stale:#8a4300;--stalebg:#fcebcc;--avail:#0a6670;--availbg:#d8f0f2;--miss:#6b2a9e;--missbg:#f0e5fa;--nid:#a3155e;--nidbg:#fbe4f0;--bad:#b3201c;--badbg:#fce3e1;
--mast:rgba(18,19,22,.9);--mastsolid:#16171b;--sheet:rgba(255,255,255,.94);--sheetsolid:#fff;
--sh:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.06);--shbig:0 10px 40px rgba(0,0,0,.18),0 2px 8px rgba(0,0,0,.08);
--ease:cubic-bezier(.23,1,.32,1);--drawer:cubic-bezier(.32,.72,0,1)}
@media (prefers-color-scheme:dark){:root{
--canvas:#000;--surf:#1c1c1e;--surf2:#232326;--hov:#2a2a2d;--line:#313135;--line2:#4a4a50;
--fg:#f5f5f7;--mut:#adadb7;--accent:#78b0ff;--accbg:#14233d;--tint:rgba(106,167,255,.12);--tint2:rgba(106,167,255,.22);
--ok:#66d98f;--okbg:#12301d;--unv:#b7bfca;--unvbg:#2c2f35;--stale:#f6b45c;--stalebg:#3a2a0f;--avail:#62d3dd;--availbg:#0e3539;--miss:#d6b4ff;--missbg:#2f1b4b;--nid:#ff9dcb;--nidbg:#46152f;--bad:#ff9f99;--badbg:#40181a;
--mast:rgba(28,28,30,.82);--mastsolid:#1c1c1e;--sheet:rgba(36,36,39,.94);--sheetsolid:#242427;
--sh:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);--shbig:0 10px 40px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.4)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:64px}
body{margin:0;background:var(--canvas);color:var(--fg);font:.875rem/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,Roboto,"Helvetica Neue",Arial,sans-serif;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;accent-color:var(--accent);caret-color:var(--accent)}
::selection{background:var(--tint2);color:var(--fg)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3,p{margin:0}
code{font:12.5px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow-wrap:anywhere}
button{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mut{color:var(--mut)}
.ic{display:inline-flex;flex:none;width:16px;height:16px}
.ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round}
.skip{position:absolute;left:8px;top:-48px;background:var(--surf);padding:8px 12px;border-radius:8px;z-index:50}
.skip:focus{top:8px}

/* masthead: translucent material, content scrolls under it */
.mast{position:sticky;top:0;z-index:30;height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 16px;color:#f5f5f7;background:var(--mast);-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border-bottom:1px solid rgba(255,255,255,.08);box-shadow:inset 0 -1px 0 rgba(0,0,0,.3)}
.mast :focus-visible{outline-color:#8db8ff}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;letter-spacing:-.01em;white-space:nowrap}
.brand svg{width:26px;height:26px;flex:none}
.mast-r{display:flex;align-items:center;gap:10px;min-width:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.1);color:#d8d8de;font-size:12.5px;letter-spacing:.005em;white-space:nowrap}
.chip i{width:7px;height:7px;border-radius:50%;background:#5fd68a;display:block}
.dd{position:relative;display:inline-flex;align-items:center;min-width:0}
.dd select{appearance:none;-webkit-appearance:none;font:inherit;color:var(--fg);background:var(--surf);border:1px solid var(--line2);border-radius:10px;height:34px;padding:0 30px 0 12px;min-width:0;max-width:100%;cursor:pointer;transition:background-color 150ms ease,border-color 150ms ease,transform 120ms var(--ease)}
.dd select option{background:var(--surf);color:var(--fg)}
.dd>.ic{position:absolute;right:10px;pointer-events:none;color:var(--mut)}
.dd select:active{transform:scale(.98)}
.sw select{height:36px;border-radius:999px;padding:0 34px 0 44px;color:#f5f5f7;background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.18);font-weight:500;min-width:170px;max-width:260px;text-overflow:ellipsis}
.sw>.ic{color:#dcdce2}
.sw .av{position:absolute;left:5px;pointer-events:none}
@media (hover:hover) and (pointer:fine){.sw select:hover{background:rgba(255,255,255,.2)}.dd select:hover{background:var(--hov)}}
@media (max-width:640px){.mast{padding:0 12px}.brand span.t{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}.chip{display:none}.sw select{min-width:0;width:100%}.mast-r{flex:1;justify-content:flex-end}}

.av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;color:#fff;font-size:10.5px;font-weight:600;letter-spacing:.02em}
.av::before{content:attr(data-i)}
.av0{background:#3552c9}.av1{background:#0b6f82}.av2{background:#9333b0}.av3{background:#b83e0a}.av4{background:#2b7a2e}.av5{background:#5b3cc4}
.av.s{width:20px;height:20px;font-size:9px}

/* branches: masthead button, popover, info bar, tags */
.mbtn{all:unset;box-sizing:border-box;cursor:pointer;position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:7px;height:36px;padding:0 12px 0 10px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.12);color:#f5f5f7;font-weight:500;white-space:nowrap;transition:background-color 150ms ease,transform 120ms var(--ease)}
.mbtn[hidden]{display:none}
.mbtn:focus-visible{outline:2px solid #8db8ff;outline-offset:2px}
.mbtn:active{transform:scale(.97)}
.mbtn[aria-expanded=true]{background:rgba(255,255,255,.24)}
.mbtn .bn{min-width:18px;padding:0 5px;border-radius:999px;background:#8db8ff;color:#0b1b33;font-size:11.5px;font-weight:600;line-height:18px;text-align:center}
.mbtn.busy::after{content:"";position:absolute;left:0;bottom:0;height:2px;width:40%;background:#8db8ff;animation:slide 1s var(--ease) infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){.mbtn.busy::after{animation:none;width:100%;opacity:.7}}
@media (hover:hover) and (pointer:fine){.mbtn:hover{background:rgba(255,255,255,.2)}}
.brpop{position:absolute;top:calc(100% + 8px);right:16px;z-index:40;width:min(380px,calc(100vw - 24px));max-height:calc(100vh - 80px);overflow:auto;padding:14px 16px 16px;color:var(--fg);background:var(--sheetsolid);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shbig);transform-origin:top right;animation:pop 160ms var(--ease)}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
@media (prefers-reduced-motion:reduce){.brpop{animation:none}}
.brpop[hidden]{display:none}
.brpop :focus-visible{outline-color:var(--accent)}
.brpop h2{font-size:14px;font-weight:600;letter-spacing:-.005em}
.brpop .hint{margin:2px 0 10px}
.brrow{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.5fr);gap:8px 12px;align-items:center;padding:7px 0}
.brrow+.brrow{border-top:1px solid var(--line)}
.brrow .tn{display:flex;align-items:center;gap:8px;min-width:0;font-weight:500;overflow-wrap:anywhere}
.brrow .dd{display:flex}
.brrow .dd select{width:100%;height:32px;text-overflow:ellipsis}
.brrow .flt{margin:0 0 6px;height:30px}
.brerr{margin:8px 0 0;padding:8px 10px;border-radius:9px;background:var(--badbg);color:var(--bad);font-size:13px;overflow-wrap:anywhere}
.brerr[hidden]{display:none}
.bract{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:12px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--canvas)}
.btn:disabled{opacity:.6;cursor:default}
@media (max-width:640px){.brpop{left:12px;right:12px;width:auto}}
.viewbar{background:var(--accbg);border-bottom:1px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.viewbar[hidden]{display:none}
.vb{max-width:1400px;margin:0 auto;padding:8px 16px;display:flex;align-items:flex-start;gap:8px;font-size:13.5px;line-height:1.5}
.vb>.ic{color:var(--accent);margin-top:2.5px}
.vb code{font-size:12.5px}
.vb .link{font-weight:600}
.vb.note{color:var(--mut)}
@media (min-width:900px){.vb{padding:8px 28px}}
.btag{display:inline-flex;align-items:center;flex:none;max-width:14ch;margin-left:6px;padding:0 7px;border-radius:999px;background:var(--tint2);color:var(--accent);font:600 11px/18px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.m th .btag,.sumrow .btag,.tsec h3 .btag,.tchip .btag,.charts .r1 .btag,.title h1 .btag{margin-left:0}
main[aria-busy=true]{opacity:.55;transition:opacity 150ms ease}

/* canvas */
main{min-width:0;padding:12px 16px 0}
.shell{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr)}
.title{margin-bottom:16px}
.title h1{font-size:1.375rem;line-height:1.2;font-weight:600;letter-spacing:-.02em;overflow-wrap:anywhere}
.title p{color:var(--mut);margin-top:4px;font-size:13.5px}
.title h1 .tn{color:var(--mut);font-weight:500}

/* site navigation: sidebar on desktop, scrolling chip row on small screens (one list, one set of semantics) */
.sitenav{padding:16px 16px 0;min-width:0}
.nh{display:none;margin:0 10px 6px;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--mut)}
.sitenav ul{list-style:none;margin:0;padding:0 0 2px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.ni{all:unset;box-sizing:border-box;position:relative;cursor:pointer;display:flex;align-items:center;gap:8px;white-space:nowrap;min-height:36px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surf);font-weight:500;transition:background-color 150ms ease,border-color 150ms ease,transform 120ms var(--ease)}
.ni:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.ni:active{transform:scale(.97)}
.ni[aria-current=page]{background:var(--accbg);border-color:var(--accent);color:var(--accent);font-weight:600}
.nl{min-width:0;overflow:hidden;text-overflow:ellipsis}
.nbs{display:flex;align-items:center;gap:3px;margin-left:auto}
.nbd{font-size:11.5px;font-weight:600;line-height:18px;padding:0 6px;border-radius:999px;color:var(--c);background:var(--b)}
.nc{color:var(--mut);font-size:12.5px;min-width:1.4em;text-align:right;font-weight:400}
.ni[aria-current=page] .nc{color:inherit;opacity:.8}
@media (hover:hover) and (pointer:fine){.ni:hover{background:var(--hov)}.ni[aria-current=page]:hover{background:var(--accbg)}}
@media (min-width:900px){
.shell{grid-template-columns:260px minmax(0,1fr)}
main{padding:28px 28px 0 20px}
.sitenav{position:sticky;top:52px;align-self:start;max-height:calc(100vh - 52px);overflow-y:auto;padding:28px 0 24px 28px}
.nh{display:block}
.sitenav ul{flex-direction:column;overflow:visible;gap:2px}
.ni{width:100%;border-radius:10px;border-color:transparent;background:none;padding:0 10px;position:relative}
.ni[aria-current=page]{border-color:transparent;box-shadow:inset 3px 0 0 var(--accent)}
}
.surface{background:var(--surf);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}

/* alerts */
#banner{display:grid;gap:10px;margin-bottom:16px}
.banner{display:flex;gap:12px;padding:12px 16px;border-radius:12px;border:1px solid;max-width:900px}
.banner.info{background:var(--accbg);border-color:color-mix(in srgb,var(--accent) 35%,transparent)}
.banner.warn{background:var(--stalebg);border-color:color-mix(in srgb,var(--stale) 40%,transparent)}
.banner>.ic{margin-top:2px}.banner.info>.ic{color:var(--accent)}.banner.warn>.ic{color:var(--stale)}
.banner b,.banner summary{font-weight:600}
.banner p{color:var(--fg)}
.banner details{min-width:0;overflow-wrap:anywhere}
.banner summary{cursor:pointer}
.banner ul{margin:6px 0 0;padding-left:18px}
.banner .more{margin-top:4px;color:var(--mut)}

/* summary tiles */
.tiles{display:grid;grid-template-columns:repeat(var(--nt,4),minmax(0,1fr));gap:12px;margin-bottom:20px}
@media (max-width:760px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tiles .tile:last-child:nth-child(odd){grid-column:span 2}}
.tile{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:2px;padding:14px 16px 14px;background:var(--surf);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh);transition:transform 140ms var(--ease),background-color 150ms ease,border-color 150ms ease,box-shadow 150ms ease;min-width:0}
.tile:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tile .top{display:flex;align-items:center;gap:10px;font-weight:500;font-size:13.5px}
.cir{width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none}
.cir .ic,.cir .ic svg{width:17px;height:17px}
.tile .num{font-size:1.9rem;line-height:1.15;font-weight:600;letter-spacing:-.025em;margin-top:6px}
.tile .cap{color:var(--mut);font-size:12.5px;letter-spacing:.005em}
.tile[aria-pressed=true]{border-color:var(--accent);background:var(--accbg);box-shadow:0 0 0 1px var(--accent),var(--sh)}
.tile:active{transform:scale(.985)}
@media (hover:hover) and (pointer:fine){.tile:hover{border-color:var(--line2);box-shadow:var(--shbig);transform:translateY(-1px)}.tile[aria-pressed=true]:hover{border-color:var(--accent)}}
.s-onboarded{--c:var(--ok);--b:var(--okbg)}.s-unverified{--c:var(--unv);--b:var(--unvbg)}.s-stale{--c:var(--stale);--b:var(--stalebg)}.s-available{--c:var(--avail);--b:var(--availbg)}.s-missing{--c:var(--miss);--b:var(--missbg)}.s-none{--c:var(--mut);--b:transparent}.s-conflict{--c:var(--bad);--b:var(--badbg)}.s-version-skew{--c:var(--stale);--b:var(--stalebg)}.s-nid{--c:var(--nid);--b:var(--nidbg)}
.cir{color:var(--c);background:var(--b)}

/* segmented control */
.seg{display:inline-flex;max-width:100%;overflow-x:auto;padding:3px;background:color-mix(in srgb,var(--fg) 8%,var(--canvas));border-radius:12px;gap:2px;margin-bottom:16px;scrollbar-width:none}
.seg button{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:9px;font-weight:500;white-space:nowrap;color:var(--mut);transition:background-color 150ms ease,color 150ms ease,transform 120ms var(--ease)}
.seg button[hidden]{display:none}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg button[aria-selected=true]{background:var(--surf);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.06)}
.seg button:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){.seg button[aria-selected=false]:hover{color:var(--fg)}}
.badge{min-width:20px;padding:0 6px;border-radius:999px;font-size:12px;line-height:20px;text-align:center;background:var(--unvbg);color:var(--fg);font-weight:600}
.badge.red{background:var(--bad);color:#fff}
.badge.amber{background:var(--stalebg);color:var(--stale)}
@media (prefers-color-scheme:dark){.badge.red{color:#1c0a09}}

/* inset grouped lists */
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:24px;align-items:start}
.ghead{display:flex;align-items:center;gap:12px;margin:0 4px 10px}
.ghead h2{font-size:1rem;font-weight:600;letter-spacing:-.01em}
.ghead p{color:var(--mut);font-size:13px}
.inset{background:var(--surf);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);overflow:hidden}
.acts{list-style:none;margin:0;padding:0}
.acts li{position:relative;padding:12px 16px;transition:background-color 120ms ease}
.acts li+li{border-top:1px solid var(--line)}
.acts .nmrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rowbtn{all:unset;box-sizing:border-box;cursor:pointer;font-weight:600;overflow-wrap:anywhere;letter-spacing:-.005em}
.rowbtn::after{content:"";position:absolute;inset:0}
.rowbtn:focus-visible{outline:none}
.acts li:has(.rowbtn:focus-visible){outline:2px solid var(--accent);outline-offset:-2px;border-radius:8px}
.acts li:has(.rowbtn:active){background:var(--tint2)}
@media (hover:hover) and (pointer:fine){.acts li:hover{background:var(--hov)}}
.kind{font-size:11.5px;font-weight:500;color:var(--mut);background:var(--surf2);border:1px solid var(--line);border-radius:6px;padding:0 6px;line-height:18px}
.why{color:var(--mut);margin-top:2px;overflow-wrap:anywhere}
.path{margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;position:relative;z-index:1}
.path>span.l{color:var(--mut);font-size:12.5px;min-width:3.4rem}
.pe{display:inline-flex;align-items:center;gap:2px;max-width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:8px;padding:0 2px 0 8px}
.pe code{user-select:all;padding:3px 0}
.copy{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:4px;height:26px;min-width:26px;justify-content:center;padding:0 6px;border-radius:6px;color:var(--mut);font-size:12px;transition:background-color 120ms ease,color 120ms ease,transform 120ms var(--ease)}
.copy:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.copy:active{transform:scale(.92)}
.copy.done{color:var(--ok)}
@media (hover:hover) and (pointer:fine){.copy:hover{background:var(--hov);color:var(--fg)}}
@media (pointer:coarse){.copy{height:34px;min-width:34px}}
.btn{font:inherit;color:var(--fg);background:var(--surf);border:1px solid var(--line2);border-radius:10px;height:34px;padding:0 14px;cursor:pointer;font-weight:500;transition:background-color 150ms ease,transform 120ms var(--ease)}
.btn:active{transform:scale(.97)}
.btn.more{margin:10px 4px 0}
@media (hover:hover) and (pointer:fine){.btn:hover{background:var(--hov)}}
.link{all:unset;cursor:pointer;color:var(--accent);font-weight:600;border-radius:4px}
.link:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.link:active{opacity:.7}
.conf li b{font-weight:600;overflow-wrap:anywhere}
@media (hover:hover) and (pointer:fine){.acts.conf li:hover{background:none}}
.ents{list-style:none;margin:8px 0 0;padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surf2);overflow:hidden}
.ents li{display:flex;flex-wrap:wrap;align-items:center;gap:4px 10px;padding:7px 10px}
.ents li+li{border-top:1px solid var(--line)}
.ents .em{color:var(--mut);font-size:12.5px;overflow-wrap:anywhere}
.tchip{display:inline-flex;align-items:center;gap:6px;padding:2px 10px 2px 3px;border-radius:999px;background:var(--surf2);border:1px solid var(--line);font-size:13px;overflow-wrap:anywhere}
.tchip small{color:var(--mut);font-size:12px}
.sumrow{display:grid;grid-template-columns:minmax(0,1.6fr) repeat(var(--nt,4),minmax(0,.7fr));gap:8px;align-items:center;padding:10px 16px}
.sumrow+.sumrow{border-top:1px solid var(--line)}
.sumhead{color:var(--mut);font-size:12.5px;font-weight:500;background:var(--surf2)}
.sumrow .n{text-align:right}
.sumrow .tn{display:flex;align-items:center;gap:10px;min-width:0;overflow-wrap:anywhere}
@media (max-width:520px){.sumrow{grid-template-columns:minmax(0,1.5fr) repeat(var(--nt,4),minmax(0,.6fr));padding:10px 12px;gap:4px;font-size:13px}.sumrow .tn .av{display:none}}

/* status pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 7px;border-radius:999px;font-size:12.5px;font-weight:500;line-height:20px;white-space:nowrap;color:var(--c);background:var(--b);letter-spacing:.005em}
.pill .ic,.pill .ic svg{width:14px;height:14px}
.pill .n{font-weight:600}

  const trig = S.trig; S.open = null; S.trig = null;
  const s = $('sheet'); s.classList.remove('open'); s.inert = true; markOpen();
  if (refocus && trig && trig.isConnected) trig.focus({ preventScroll: true });
}
function markOpen() {
  document.querySelectorAll('[aria-expanded=true][data-k],#m td.nm [aria-expanded=true],.shs[aria-expanded=true]').forEach(b => b.setAttribute('aria-expanded', 'false'));
  if (!S.open) return;
  if (S.open.site != null) { const b = document.querySelector(`.shs[data-site="${CSS.escape(S.open.site)}"]`); if (b) { b.setAttribute('aria-expanded', 'true'); if (!S.trig || !S.trig.isConnected) S.trig = b; } return; }
  const tr = [...document.querySelectorAll('#m tr.r')].find(x => x.querySelector('.name')?.textContent === S.open.n);
  const b = tr && (S.open.t ? tr.querySelector(`[data-k="${CSS.escape(key(S.open.n, S.open.t))}"]`) : tr.querySelector('td.nm .cb'));
  if (b) { b.setAttribute('aria-expanded', 'true'); if (!S.trig || !S.trig.isConnected) S.trig = b; }
}
$('sclose').onclick = () => closeSheet(true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.open && $('brpop').hidden) { e.preventDefault(); closeSheet(true); } });

/* ---------- state, hash, wiring ---------- */
function parseHash() {
  const p = new URLSearchParams(location.hash.slice(1)), t = p.get('tenant'), tab = p.get('tab'), site = p.get('site');
  return { site: SITES.includes(site) ? site : '', tenant: D.tenants.includes(t) ? t : null, tab: TABS.includes(tab) ? tab : null, fold: new Set((p.get('fold') || '').split(',').filter(x => SITES.includes(x))) };
}
/* refs=a:dev,b:release is read from the raw hash: a branch name may hold %2C (comma) or %2F (slash) */
function hashRefs() {
  const raw = location.hash.slice(1).split('&').find(x => x.startsWith('refs=')), out = {};
  if (raw) raw.slice(5).split(',').forEach(x => { const i = x.indexOf(':'); try { if (i > 0) out[decodeURIComponent(x.slice(0, i))] = decodeURIComponent(x.slice(i + 1)); } catch (e) {} });
  return out;
}
function writeHash() {
  const p = new URLSearchParams(); if (S.site) p.set('site', S.site); if (S.tenant) p.set('tenant', S.tenant); if (S.tab) p.set('tab', S.tab);
  let q = p.toString(); if (S.fold.size && !S.site) q += (q ? '&' : '') + 'fold=' + [...S.fold].sort().map(encodeURIComponent).join(',');
  const e = Object.entries(S.refs).sort(), r = e.length ? 'refs=' + e.map(([t, b]) => encodeURIComponent(t) + ':' + encodeURIComponent(b)).join(',') : '';
  q = [r, q].filter(Boolean).join('&');
  history.replaceState(null, '', q ? '#' + q : location.pathname + location.search);
}
function applyHash() { const p = parseHash(); S.site = p.site; S.tenant = p.tenant; S.tab = p.tab; S.fold = p.fold; }
function renderAll() { fillEnv(); renderNav(); renderCtx(); renderTiles(); renderActions(); renderConflicts(); renderSettings(); renderMatrix(); renderTabs(); $('tenant').value = S.tenant || ''; }
function setSite(k) {
  if (k === S.site) return;
  closeSheet(false); S.site = k; writeHash(); renderAll(); flash($('area')); flash($('wrap'));
  document.querySelector(`#sitelist .ni[data-site="${CSS.escape(k)}"]`)?.focus({ preventScroll: true });
}
function setTenant(t, fromHash) {
  closeSheet(false); S.tenant = t; if (!fromHash) { S.tab = null; writeHash(); }
  renderAll(); flash($('area')); flash($('wrap'));
}
const fillTenants = () => $('tenant').replaceChildren(new Option('All tenants', ''), ...D.tenants.map(t => new Option(S.refs[t] ? t + ' @ ' + S.refs[t] : t, t)));
$('tenant').onchange = e => setTenant(e.target.value || null);
$('q').oninput = e => { S.q = e.target.value; renderMatrix(); };
$('qx').onclick = () => { $('q').value = ''; S.q = ''; renderMatrix(); $('q').focus(); };
[['fs', 'status'], ['fenv', 'env']].forEach(([id, k]) => $(id).onchange = e => { S[k] = e.target.value; if (k === 'status') renderTiles(); renderMatrix(); flash($('wrap')); });
$('foldall').onclick = () => { S.fold = SITES.every(k => S.fold.has(k)) ? new Set() : new Set(SITES); writeHash(); renderMatrix(); };
$('clr').onclick = () => { clearFilters(); flash($('wrap')); };
addEventListener('resize', setCw);

/* ---------- branch views: pick a branch per tenant, fetch api/view ---------- */
const dflt = t => BASE.refs[t].branch;
const sameRefs = (a, b) => JSON.stringify(Object.entries(a).sort()) === JSON.stringify(Object.entries(b).sort());
const multi = () => !!BASE.live && Object.values(BASE.branches || {}).some(l => l.length > 1);
let seq = 0;
function setBusy(on) {
  $('brbtn').classList.toggle('busy', on); $('brbtn').setAttribute('aria-busy', on); $('main').setAttribute('aria-busy', on);
  $('brapply').disabled = on; $('brreset').disabled = on; $('brapply').textContent = on ? 'Applying\u2026' : 'Apply';
}
function renderBar() {
  const off = Object.entries(S.refs), bar = $('viewbar');
  bar.replaceChildren(...[
    off.length && h('div', { class: 'vb', role: 'status' }, icon('branch'), h('span', null, 'Viewing ', off.flatMap(([t, b], i) => [i ? ', ' : '', h('b', null, t), ' @ ', h('code', null, b), ' (', h('code', null, D.refs[t].sha.slice(0, 7)), ')']),
      off.length < D.tenants.length ? ' \u00b7 others on default branches' : '', ' \u00b7 ', h('button', { class: 'link', type: 'button', id: 'vbreset', onclick: resetAll }, 'Reset'))),
    S.note && h('div', { class: 'vb note', role: 'status' }, icon('info'), h('span', null, S.note))].filter(Boolean));
  bar.hidden = !bar.firstChild;
}
function renderBranches() {
  const n = Object.keys(S.refs).length, b = $('brbtn');
  b.hidden = !multi();
  b.replaceChildren(icon('branch'), 'Branches', ...(n ? [h('span', { class: 'bn' }, n, h('span', { class: 'sr' }, ' not on the default branch'))] : []));
  renderBar();
}
/* swap in a new D (default view or branch view) and redraw; the user's tenant, site and tab stay when they still exist */
function setData(d, refs) {
  closeSheet(false); D = d; S.refs = refs; derive();
  if (!D.tenants.includes(S.tenant)) S.tenant = null;
  if (!SITES.includes(S.site)) S.site = '';
  S.fold = new Set([...S.fold].filter(x => SITES.includes(x)));
  if ((S.status === 'nid' && !nidSet.size) || (S.status === 'missing' && !D.expected_on)) S.status = 'all';
  for (const k in more) delete more[k];
  renderChrome(); fillStatus(); fillTenants(); renderBranches(); renderAll();
}
function showErr(msg) {
  if ($('brpop').hidden) { S.note = msg; renderBar(); } else { $('brerr').textContent = msg; $('brerr').hidden = false; }
}
async function loadRefs(refs) {  // refs: only tenants off their default branch. -> true when D now matches
  const my = ++seq;
  if (!Object.keys(refs).length) { setBusy(false); setData(BASE, {}); return true; }
  setBusy(true);
  try {
    const r = await fetch('api/view?' + Object.entries(refs).map(([t, b]) => 'ref=' + encodeURIComponent(t + ':' + b)).join('&'), { headers: { accept: 'application/json' } });
    const j = await r.json().catch(() => ({}));
    if (my !== seq) return false;
    if (!r.ok) throw new Error(j.error || 'The server answered ' + r.status + '.');
    j.generated = BASE.generated; setData(j, refs); return true;
  } catch (e) {
    if (my === seq) showErr(e instanceof TypeError ? 'Could not reach the server.' : e.message);
    return false;
  } finally { if (my === seq) setBusy(false); }
}
/* the hash is the source of truth on load and on hashchange: unknown tenants/branches fall back to the default with a one-line notice */
async function fromHash() {
  const want = hashRefs(), have = Object.keys(want).length;
  if (!BASE.live) { S.note = have ? 'Branch views need the running server; showing the default branches.' : ''; return renderBar(); }
  const ok = {}, notes = [];
  for (const [t, b] of Object.entries(want)) {
    if (!(t in BASE.branches)) notes.push(`Tenant ${t} was not found.`);
    else if (!BASE.branches[t].includes(b)) notes.push(`Branch ${b} of ${t} no longer exists; showing ${dflt(t)}.`);
    else if (b !== dflt(t)) ok[t] = b;
  }
  S.note = notes.join(' ');
  if (sameRefs(ok, S.refs)) return renderBar();
  await loadRefs(ok);
}
async function resetAll() {
  S.note = ''; $('brerr').hidden = true;
  if (await loadRefs({})) { writeHash(); setPop(false); $('brbtn').focus(); }
}
let draft = {};
function brRow(t, i) {
  const def = dflt(t), names = [def, ...D.branches[t].filter(n => n !== def)], sel = h('select', { id: 'brs' + i }), many = names.length > 15;
  const fill = q => {
    const cur = draft[t] || def, shown = names.filter(n => n === cur || !q || n.toLowerCase().includes(q));
    sel.replaceChildren(...shown.map(n => new Option(n === def ? n + ' (default)' : n, n))); sel.value = cur;
  };
  sel.onchange = () => { sel.value === def ? delete draft[t] : draft[t] = sel.value; };
  fill('');
  return h('div', { class: 'brrow' }, h('span', { class: 'tn' }, avatar(t, true), t),
    h('div', null, many && h('input', { class: 'flt', type: 'search', 'aria-label': 'Filter the ' + names.length + ' branches of ' + t, placeholder: 'Filter ' + names.length + ' branches', oninput: e => fill(e.target.value.trim().toLowerCase()) }),
      h('div', { class: 'dd' }, h('label', { class: 'sr', for: 'brs' + i }, 'Branch of ' + t), sel, icon('down'))));
}
function setPop(open) {
  const p = $('brpop');
  if (open) { draft = { ...S.refs }; $('brerr').hidden = true; $('brlist').replaceChildren(...BASE.tenants.filter(t => (D.branches[t] || []).length > 1).map(brRow)); }
  p.hidden = !open; $('brbtn').setAttribute('aria-expanded', open);
  if (open) p.querySelector('select, input').focus();
}
$('brbtn').onclick = () => setPop($('brpop').hidden);
$('brreset').onclick = resetAll;
$('brapply').onclick = async () => {
  S.note = ''; $('brerr').hidden = true;
  if (await loadRefs({ ...draft })) { renderBar(); writeHash(); setPop(false); $('brbtn').focus(); }
};
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('brpop').hidden) { e.preventDefault(); setPop(false); $('brbtn').focus(); } });
document.addEventListener('pointerdown', e => { if (!$('brpop').hidden && !e.target.closest('#brpop, #brbtn')) setPop(false); });
addEventListener('hashchange', async () => { await fromHash(); applyHash(); renderAll(); closeSheet(false); });

derive(); renderChrome(); fillStatus(); fillTenants(); applyHash(); renderBranches(); renderAll();
if (BASE.live && Object.keys(hashRefs()).length) setBusy(true);  // do not show the default data as if it were the requested view
fromHash().then(() => { applyHash(); renderAll(); if (S.note || Object.keys(S.refs).length) writeHash(); }).finally(() => setBusy(false));
</script>
</body>
